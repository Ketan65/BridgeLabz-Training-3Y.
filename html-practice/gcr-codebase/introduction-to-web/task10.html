<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Architecture Flow Diagram</title>
</head>
<body>
    <h1>Basic Web Architecture Flow</h1>
    <p>Overview of how Client, Server, API, and Database interact in modern web applications.</p>

    <svg width="650" height="220" style="border: 1px solid #ddd; background-color: #fff;">
        <rect x="20" y="70" width="110" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
        <text x="75" y="110" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#0d47a1">Client (UI)</text>

        <path d="M 130 95 L 200 95" stroke="#333" stroke-width="2"/>
        <text x="165" y="85" font-family="sans-serif" font-size="10" text-anchor="middle">HTTP Request</text>

        <rect x="200" y="70" width="110" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
        <text x="255" y="110" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1b5e20">API Gateway</text>

        <path d="M 310 95 L 380 95" stroke="#333" stroke-width="2"/>
        <text x="345" y="85" font-family="sans-serif" font-size="10" text-anchor="middle">Routing</text>

        <rect x="380" y="70" width="110" height="70" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
        <text x="435" y="110" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#e65100">Web Server</text>

        <path d="M 490 95 L 560 95" stroke="#333" stroke-width="2"/>
        <text x="525" y="85" font-family="sans-serif" font-size="10" text-anchor="middle">SQL Query</text>

        <rect x="560" y="70" width="80" height="70" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
        <text x="600" y="110" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#4a148c">Database</text>
    </svg>
</body>
</html>
